---
name: "ml-gateway"

services:

  ml-gateway:
    image: ml-gateway
    hostname: ml-gateway
    restart: always
    build:
      context: .
      dockerfile: .docker/images/fast_api/dockerfile-api
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    environment:
      - PYTHONUNBUFFERED=TRUE
      - ML_GATEWAY_INDEX_DIR=/home/basicuser/index
      # Shared secret for POST /index/attack-biencoder; unset = indexing refused.
      - ML_GATEWAY_INDEX_TOKEN=${ML_GATEWAY_INDEX_TOKEN:-}
    volumes:
      # Bi-encoder vector index; must survive restarts and be shared by
      # every worker process.
      - ml-gateway-index:/home/basicuser/index
    ports:
      # Localhost only: the gateway must not be reachable from the Internet.
      - "127.0.0.1:8000:8000"
    networks:
      - gateway
    healthcheck:
      test: curl --fail http://localhost:8000 || exit 1
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 60s

  autoheal:
    image: willfarrell/autoheal:latest
    hostname: autoheal
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    networks:
      - gateway

networks:
  gateway:

volumes:
  ml-gateway-index:
